org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
# The app version. Change both lines for every release:
#  - APP_VERSION_CODE must go up by 1 each time (Android uses it to allow updates).
#  - APP_VERSION_NAME is what people see, and must match APP_VERSION in app/src/main/assets/index.html
#    and the release tag (for example v1.5).
APP_VERSION_CODE=6
APP_VERSION_NAME=1.5
