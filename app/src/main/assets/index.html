<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paco’s Fitness Tracker</title>
<meta name="color-scheme" content="light dark">
<style>
/* Layout: phone-first single column app shell; sticky header, scrolling content, fixed bottom nav, bottom-sheet editors. */
:root{
  --bg:#f2f4fa; --surface:#ffffff; --surface2:#e9edf7; --fg:#131a2d; --muted:#5b6582; --line:#dce1ee;
  --coral:#ff5446; --amber:#ffa928; --teal:#0fb3a2; --lime:#7fcc3c; --violet:#6d5ce8; --sky:#2f8cff;
  --good:#16a34a; --danger:#e23d3d;
  --shadow:0 6px 20px rgba(24,34,70,.08);
  --body:#e3e7f1; --mnone:#ccd3e5; --mp:#ff5446; --ms:#ffa928;
  --font:"SamsungOne","Roboto","Segoe UI",system-ui,-apple-system,sans-serif;
  --display:"Roboto Condensed","Arial Narrow","SamsungOne","Roboto",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1020; --surface:#161b30; --surface2:#1f2540; --fg:#eef1fa; --muted:#98a1bf; --line:#2a3152;
  --coral:#ff6a5c; --amber:#ffb640; --teal:#1fd0bd; --lime:#95dd52; --violet:#8b7cff; --sky:#4a9dff;
  --shadow:0 6px 20px rgba(0,0,0,.35); --body:#262d4a; --mnone:#353e63; --mp:#ff6a5c; --ms:#ffb640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1020; --surface:#161b30; --surface2:#1f2540; --fg:#eef1fa; --muted:#98a1bf; --line:#2a3152;
  --coral:#ff6a5c; --amber:#ffb640; --teal:#1fd0bd; --lime:#95dd52; --violet:#8b7cff; --sky:#4a9dff;
  --shadow:0 6px 20px rgba(0,0,0,.35); --body:#262d4a; --mnone:#353e63; --mp:#ff6a5c; --ms:#ffb640; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
#app{max-width:640px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;white-space:nowrap;min-width:0;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--coral),var(--amber));display:grid;place-items:center;color:#fff}
.brand small{font-family:var(--font);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
h2{font-family:var(--display);font-size:20px;margin:22px 0 10px;letter-spacing:.3px;text-wrap:balance}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Hero date card */
.hero{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--coral) 0%,#ff7a3d 45%,var(--amber) 100%);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .row{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.hero .when{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05}
.hero .sub{opacity:.92;font-size:13.5px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.35}
.datepick{position:relative;flex:1;min-width:0}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.2);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;opacity:.9}

/* Entry cards */
.list{display:flex;flex-direction:column;gap:10px}
.entry{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.entry .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.ico.w{background:linear-gradient(135deg,var(--violet),var(--sky))}
.ico.t{background:linear-gradient(135deg,var(--teal),var(--lime))}
.ico.b{background:linear-gradient(135deg,var(--coral),var(--amber))}
.ico.e{background:linear-gradient(135deg,var(--sky),var(--teal))}
.entry .body{flex:1;min-width:0}
.entry .name{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .meta{color:var(--muted);font-size:13.5px}
.entry .big{font-family:var(--display);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.entry .big small{display:block;font-family:var(--font);font-size:11px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--fg);font-variant-numeric:tabular-nums}
.chip.t{background:color-mix(in srgb,var(--teal) 18%,transparent)}
.chip.w{background:color-mix(in srgb,var(--violet) 16%,transparent)}
.chip.b{background:color-mix(in srgb,var(--coral) 16%,transparent)}
.chip.e{background:color-mix(in srgb,var(--sky) 18%,transparent)}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.actions.two{grid-template-columns:1fr 1fr}
.actions .btn{flex-direction:column;gap:4px;padding:11px 6px;font-size:13.5px}
.btn{border:0;border-radius:14px;padding:13px 12px;white-space:nowrap;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--fg)}
.btn.primary{background:linear-gradient(135deg,var(--violet),var(--sky));color:#fff}
.btn.cardio{background:linear-gradient(135deg,var(--teal),var(--lime));color:#fff}
.btn.hot{background:linear-gradient(135deg,var(--coral),var(--amber));color:#fff}
.btn.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg);display:block;font-size:16px;margin-bottom:4px}
.suggest{margin-top:12px}

/* Segmented control */
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.toolbar .seg{flex:1;min-width:200px}

/* Cards / tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.wk{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.wk .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wk .d{font-weight:800;font-size:16px}
.wk .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.month{margin:18px 0 6px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:active{background:var(--surface2)}
td.best{color:var(--good);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kpi .up{color:var(--good)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px 6px}
.chartbox canvas{width:100%;height:240px;display:block;touch-action:pan-y}
.metrics{display:flex;gap:6px;flex-wrap:wrap;padding:0 6px 8px}
.metrics button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.metrics button.on{border-color:transparent;color:#fff;background:var(--mc,var(--violet))}
select.picker,.field input,.field select{width:100%;padding:12px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
select.picker{font-weight:700}

/* Machines tab */
.mach{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.mach svg.spark{flex:none}
.mach .body{flex:1;min-width:0}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--coral)}
nav.tabs button.on .pill{background:color-mix(in srgb,var(--coral) 16%,transparent)}
nav.tabs .pill{padding:3px 16px;border-radius:999px;display:grid;place-items:center}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--display);font-size:22px;margin:0 0 4px}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheethead .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.xbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;margin-left:auto;flex:none}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;width:52px;background:var(--surface2);font-size:22px;font-weight:700;flex:none}
.stepper input{border:0!important;border-radius:0!important;text-align:center;font-weight:800;font-size:20px!important;min-width:0;font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.setbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center}
.setbox label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.setbox input{width:100%;border:0;background:transparent;text-align:center;font-size:20px;font-weight:800;padding:2px 0;font-variant-numeric:tabular-nums}
.note{font-size:13px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--sky) 14%,transparent);display:flex;gap:8px;align-items:center}
.note.warn{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.derived{display:flex;gap:10px}
.derived div{flex:1;background:var(--surface2);border-radius:12px;padding:8px;text-align:center}
.derived b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.derived span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.detail-entry{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:12px;align-items:flex-start}
.detail-entry:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.previewbar{font-size:12.5px;background:color-mix(in srgb,var(--sky) 14%,transparent);border-radius:12px;padding:8px 12px;margin-top:4px}
/* Muscle map */
svg.body{display:block;width:100%;height:auto}
svg.body g *{stroke:var(--surface);stroke-width:1.3}
svg.body .bd *{fill:var(--body)} svg.body .mn *{fill:var(--mnone)} svg.body .mp *{fill:var(--mp)} svg.body .ms *{fill:var(--ms)}
svg.body .bl{font-size:11px;fill:var(--muted);letter-spacing:2px;stroke:none!important;font-family:var(--font);font-weight:700}
svg.body.edit [data-m]{cursor:pointer}
.muscard{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.muscard.wide{grid-template-columns:minmax(0,190px) minmax(0,1fr)}
.mleg{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.mleg b{margin-right:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.dot.mp{background:var(--mp)} .dot.ms{background:var(--ms)}
.mthumb{width:78px;flex:none;background:var(--surface2);border-radius:12px;padding:4px 2px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.mgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--fg)}
.mgrid button.mp{background:var(--mp);border-color:transparent;color:#fff}
.mgrid button.ms{background:var(--ms);border-color:transparent;color:#1d1400}
.linkbtn{border:0;background:none;color:var(--sky);font-weight:700;padding:4px 0;text-align:left;font-size:13.5px}
input.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.libsec{margin:18px 0 8px}
.mach .tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:1px 7px;border-radius:999px;margin-right:2px;vertical-align:1px}
.tag.w{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
.tag.b{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}
.tag.t{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal)}
.tag.e{background:color-mix(in srgb,var(--sky) 18%,transparent);color:var(--sky)}
.progrow{display:flex;gap:8px;align-items:center;margin:-2px 0 10px}
.progrow select{flex:1;min-width:0}
.plist{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.plist .chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 10px}
.plist button{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 0 0 2px}
@media (max-width:400px){#topnote{display:none}}
@media (max-width:380px){.stats,.kpis{grid-template-columns:repeat(2,1fr)}.hero .when{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg></span>Paco’s Fitness Tracker</div>
    <div class="spacer"></div>
    <small class="muted" id="topnote"></small>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-tab="log"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg></span>Workout</button>
  <button data-tab="history"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>History</button>
  <button data-tab="machines"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>Library</button>
  <button data-tab="settings"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Settings</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>

<script>
"use strict";
/* ============ Built-in catalog: common gym machines and bodyweight exercises ============ */
// [group, name, type, primary muscles, secondary muscles, isTimedHold, catalog version that added it (default 1)]
const CATALOG_V = 2;
const GROUPS = ['Chest','Back','Shoulders','Arms','Legs','Core','Full body'];
const CATALOG_LIST = [
  // ---- Weight machines ----
  ['Chest','Chest Press','weight',['chest'],['shoulders','triceps']],
  ['Chest','Incline Chest Press','weight',['chest','shoulders'],['triceps']],
  ['Chest','Decline Chest Press','weight',['chest'],['triceps','shoulders']],
  ['Chest','Pec Deck (Chest Fly)','weight',['chest'],['shoulders']],
  ['Chest','Cable Crossover','weight',['chest'],['shoulders']],
  ['Back','Lat Pulldown','weight',['lats'],['biceps','upperback','reardelts']],

function seedCatalog(d){
  const have = d.catalogV || 0;
  if (have >= CATALOG_V) return false;
  for (const [key, c] of Object.entries(CAT)) {
    if (c.since <= have) continue;   // added in a catalog version this phone already has (it may have been deleted on purpose)

    const same = d.machines.find(m => !m.cat && m.type === c.type && m.name.trim().toLowerCase() === c.name.toLowerCase());
    if (same) { same.cat = key; continue; }
    d.machines.push({id: 'c-' + key, name: c.name, type: c.type, cat: key});
  }

  [/shrug/i, ['traps'], ['forearms']],
  [/lateral|side\s*raise/i, ['shoulders'], ['traps']],
  [/shoulder|overhead|military|deltoid/i, ['shoulders'], ['triceps','traps']],
  [/incline/i, ['chest','shoulders'], ['triceps']],
  [/pec|fly|flye|cross\s*over|chest/i, /press/i, ['chest'], ['shoulders','triceps']],
  [/pull\s*-?\s*down|pull\s*-?\s*up|chin|lat\b|lats/i, ['lats'], ['biceps','upperback','reardelts']],
  [/row/i, ['upperback','lats'], ['biceps','reardelts']],
  [/dip/i, ['triceps','chest'], ['shoulders']],
  [/tricep|push\s*down|skull/i, ['triceps'], []],
  [/bicep|curl|preacher/i, ['biceps'], ['forearms']],
  [/wrist|forearm|grip/i, ['forearms'], []],
  [/oblique|rotary|torso|twist|rotation/i, ['obliques'], ['abs']],
  [/\bab\b|abs|abdominal|crunch|core/i, ['abs'], ['obliques']],
  [/bench|press/i, ['chest'], ['shoulders','triceps']],
];
function guessMuscles(name){
  for (const r of MUSCLE_RULES) {
    if (r.length === 4) { // [match, pressMatch, p, s]: fly vs press for chest machines
      if (r[0].test(name)) return r[1].test(name) ? {p:['chest'], s:['shoulders','triceps']} : {p:['chest'], s:['shoulders']};
      continue;
    }
    if (r[0].test(name)) return {p:[...r[1]], s:[...r[2]]};
  }
  return {p:[], s:[]};
}
function defaultMuscles(m){
  const c = catOf(m); if (c) return {p:[...c.p], s:[...c.s]};
  const g = guessMuscles((m && m.name) || ''); if (g.p.length || g.s.length || !m) return g;
  if (m.type === 'ergo') return {p:['shoulders','upperback'], s:['biceps','triceps','chest','forearms']};
  if (m.type === 'treadmill') return {p:['quads','hamstrings','glutes','calves'], s:[]};
  return g;
}
function musclesOf(m){ if (!m) return {p:[], s:[]}; return m.muscles || defaultMuscles(m); }
function bodySvg(mus, opts = {}){
  const p = new Set(mus.p || []), s = new Set(mus.s || []);
  const fig = (shapes, dx, label) => {
    const half = shapes.map(([id, el]) => {
      const cls = !id ? 'bd' : p.has(id) ? 'mp' : s.has(id) ? 'ms' : 'mn';
      return `<g class="${cls}"${id ? ` data-m="${id}"` : ''}>${el}</g>`;
    }).join('');
    return `<g transform="translate(${dx},0)">${half}<g transform="translate(200,0) scale(-1,1)">${half}</g>` +
      (opts.labels ? `<text x="100" y="412" text-anchor="middle" class="bl">${label}</text>` : '') + `</g>`;
  };
  const h = opts.labels ? 420 : 400;
  return `<svg class="body${opts.cls ? ' ' + opts.cls : ''}" viewBox="0 0 400 ${h}" role="img" aria-label="Muscles worked: ${esc(muscleText(mus) || 'none chosen')}">${fig(FRONT, 0, 'FRONT')}${fig(BACK, 200, 'BACK')}</svg>`;
}
function muscleText(mus){ return [...(mus.p||[]), ...(mus.s||[])].map(id => MUSCLES[id]).join(', '); }
function muscleLegend(mus){
  const p = (mus.p||[]).map(id=>MUSCLES[id]), s = (mus.s||[]).map(id=>MUSCLES[id]);
  if (!p.length && !s.length) return `<div class="muted" style="font-size:13px">No muscles set for this one yet.</div>`;
  return `<div class="mleg">${p.length ? `<div><span class="dot mp"></span><b>Primary</b> ${p.join(', ')}</div>` : ''}${s.length ? `<div><span class="dot ms"></span><b>Secondary</b> ${s.join(', ')}</div>` : ''}</div>`;
}
function combineMuscles(list){
  const p = new Set(), s = new Set();
  list.forEach(m => { const mu = musclesOf(m); mu.p.forEach(x=>p.add(x)); mu.s.forEach(x=>s.add(x)); });
  p.forEach(x => s.delete(x));
  return {p:[...p], s:[...s]};
}

/* ============ App state ============ */
const state = { tab:'log', logDate: today(), histMode:'workouts', wkView:'list', wkMetric:'volume', machineId:null, mView:'table', metric:null, progFilter:'', sheet:null, ed:null, confirm:null };

/* ============ Rendering ============ */
function musCard(mus, title, extra='', wide=false){
  return `<div class="muscard${wide?' wide':''}">${bodySvg(mus, {labels:true})}<div style="min-width:0"><div class="label" style="margin-bottom:6px">${title}</div>${muscleLegend(mus)}${extra}</div></div>`;
}
function applyTheme(){
  const t = db.settings.theme || 'dark', r = document.documentElement;
  if (t === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  try { if (NATIVE && window.AndroidBridge.setTheme) window.AndroidBridge.setTheme(t); } catch(e){}
}
function render(){
  applyTheme();
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  const v = $('#view');
  if (state.tab === 'log') v.innerHTML = viewLog();
  else if (state.tab === 'history') v.innerHTML = viewHistory();
  else if (state.tab === 'machines') v.innerHTML = viewMachines();
  else v.innerHTML = viewSettings();
  $('#topnote').textContent = NATIVE ? '' : 'Preview';
  drawCharts();
}

function cardioChips(e, m, full){
  const d = entryD(e), out = [];
  if (e.program) out.push(`<span class="chip ${typeOf(m).cls}">${esc(e.program)}</span>`);
  if (m.type === 'ergo') out.push(`<span class="chip">Level ${+e.level||0}</span>`);
  out.push(`<span class="chip">${fmtDur(e.duration)}</span>`);
  if (m.type === 'ergo' || full) { if (d) out.push(`<span class="chip">${fmtN(d,2)} ${D()}</span>`); }
  if (m.type === 'treadmill') { if (d) out.push(`<span class="chip">${fmtPace(e.duration/d)} /${D()}</span>`); if (+e.incline) out.push(`<span class="chip">${fmtN(+e.incline,1)}% incline</span>`); }
  return out.join('');
}
function entryCard(e){
  const m = machine(e.machineId) || {name:'(deleted)', type:'weight'};
  const t = isCardioT(m.type), b = m.type === 'body', T = typeOf(m), rw = repWord(m);
  const right = m.type === 'ergo' ? `<div class="big">${+e.level||0}<small>level</small></div>`
              : t ? `<div class="big">${fmtN(entryD(e),2)}<small>${D()}</small></div>`
              : b ? `<div class="big">${totalReps(e)}<small>${rw} total</small></div>`
              : `<div class="big">${fmtN(entryW(e))}<small>${W()}</small></div>`;
  const chips = t ? cardioChips(e, m)
                  : `<span class="chip ${T.cls}">${(e.reps||[]).length} sets</span>` + (e.reps||[]).map(r => `<span class="chip">${r} ${rw}</span>`).join('');
  return `<button class="entry" data-act="edit" data-id="${e.id}">
    <span class="ico ${T.cls}">${T.icon()}</span>
    <span class="body"><div class="name">${esc(m.name)}</div><div class="chips">${chips}</div></span>${right}</button>`;
}

function viewLog(){
  const d = state.logDate, list = entriesOn(d);

    const prev = workoutDates().find(x => x < d) || workoutDates()[0];

      (prev && prev !== d ? `<button class="btn ghost full suggest" data-act="openwk" data-date="${prev}">Repeat a past workout · last was ${shortDate(prev)}</button>` : '');

        <label class="datepick"><div class="sub">${d === today() ? fmtDate(d) : 'Logging a past workout · tap to change'}</div><div class="when">${relDay(d)}</div>
          <input type="date" id="logDate" value="${d}" max="${today()}" aria-label="Workout date"></label>
        ${d !== today() ? `<button class="iconbtn" data-act="gotoday" aria-label="Jump to today" style="width:auto;padding:0 12px;font-weight:700">Today</button>` : ''}
        <button class="iconbtn" data-act="day" data-n="1" aria-label="Next day" ${d >= today() ? 'disabled' : ''}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="stats">
        <div class="stat"><b>${wt.length}</b><span>Exercises</span></div>
        <div class="stat"><b>${sets}</b><span>Sets</span></div>
        <div class="stat"><b>${vol >= 10000 ? fmtN(vol/1000,1)+'k' : fmtN(vol,0)}</b><span>Vol ${W()}</span></div>
        <div class="stat"><b>${fmtN(cmin,0)} min</b><span>Cardio</span></div>

    </div>
    <h2>${list.length ? 'Logged' : ''}</h2>
    ${body}
    ${list.length ? `<h2>Muscles worked</h2>${musCard(combineMuscles(list.map(e=>machine(e.machineId))), relDay(d) === 'Today' ? 'Today' : shortDate(d), '', true)}` : ''}

/* ----- History ----- */
function machineHist(id){ const h = historyOf(id); return state.progFilter ? h.filter(e => (e.program||'') === state.progFilter) : h; }
function viewHistory(){
  const dates = workoutDates();
  let html = `<div class="toolbar"><div class="seg">
    <button class="${state.histMode==='workouts'?'on':''}" data-act="hmode" data-v="workouts">All workouts</button>
    <button class="${state.histMode==='machine'?'on':''}" data-act="hmode" data-v="machine">By machine/exercise</button></div></div>`;
  if (!dates.length) return html + `<div class="empty"><b>No history yet</b>Workouts you save will appear here.</div>`;
  if (state.histMode === 'workouts') {
    html += `<div class="toolbar"><div class="seg">${['list','table','chart'].map(v=>`<button class="${state.wkView===v?'on':''}" data-act="wkview" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div></div>`;
    if (state.wkView === 'list') {
      let lastMonth = '';
      html += dates.map(dt => {
        const list = entriesOn(dt), dd = parseD(dt), mk = MONTHS[dd.getMonth()] + ' ' + dd.getFullYear();
        const head = mk !== lastMonth ? `<div class="label month">${mk}</div>` : ''; lastMonth = mk;
        const wt = list.filter(e => !isCardio(e));
        const tr = list.filter(e => isCardio(e));
        const vol = wt.reduce((a,e)=>a+volume(e),0), dist = tr.reduce((a,e)=>a+entryD(e),0);
        return head + `<button class="wk" data-act="openwk" data-date="${dt}" style="margin-bottom:8px">

          <div class="chips">${list.map(e => { const m = machine(e.machineId)||{name:'?'}; return `<span class="chip ${typeOf(m).cls}">${esc(m.name)}</span>`; }).join('')}</div>
          <div class="v" style="margin-top:6px">${vol ? fmtN(vol,0)+' '+W()+' volume' : wt.length ? wt.reduce((a,e)=>a+(e.reps||[]).length,0)+' sets' : ''}${wt.length && tr.length ? ' · ' : ''}${tr.length ? fmtDur(tr.reduce((a,e)=>a+(+e.duration||0),0))+' cardio'+(dist ? ' · '+fmtN(dist,2)+' '+D() : '') : ''}</div></button>`;
      }).join('');
    } else if (state.wkView === 'table') {
      html += `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Items</th><th>Sets</th><th>Reps</th><th>Volume (${W()})</th><th>Cardio time</th><th>Cardio (${D()})</th></tr></thead><tbody>` +
        dates.map(dt => { const list = entriesOn(dt);
          const wt = list.filter(e => !isCardio(e)), tr = list.filter(e => isCardio(e));
          return `<tr data-act="openwk" data-date="${dt}"><td>${fmtDate(dt)}</td><td>${list.length}</td><td>${wt.reduce((a,e)=>a+(e.reps||[]).length,0)}</td><td>${wt.reduce((a,e)=>a+countReps(e),0)}</td><td>${fmtN(wt.reduce((a,e)=>a+volume(e),0),0)}</td><td>${tr.length?fmtDur(tr.reduce((a,e)=>a+(+e.duration||0),0)):'–'}</td><td>${tr.length?fmtN(tr.reduce((a,e)=>a+entryD(e),0),2):'–'}</td></tr>`; }).join('') + `</tbody></table></div>`;
    } else {
      const metrics = [['volume','Volume','violet'],['sets','Total sets','sky'],['machines','Items logged','coral'],['cmin','Cardio minutes','lime'],['dist','Cardio distance','teal']];
      html += `<div class="chartbox"><div class="metrics">${metrics.map(([k,l,c])=>`<button class="${state.wkMetric===k?'on':''}" style="--mc:var(--${c})" data-act="wkmetric" data-v="${k}">${l}</button>`).join('')}</div><canvas id="chart" data-kind="workouts"></canvas></div>
        <p class="muted" style="font-size:13px">Tap or drag across the chart to see each workout.</p>`;
    }
    return html;
  }
  // by machine
  const used = db.machines.filter(m => historyOf(m.id).length).sort((a,b)=>a.name.localeCompare(b.name));

  if (!state.machineId || !used.find(m => m.id === state.machineId)) state.machineId = used[0].id;
  const m = machine(state.machineId), t = m.type === 'treadmill', er = m.type === 'ergo', b = m.type === 'body', rw = repWord(m);
  const progs = isCardioT(m.type) ? [...new Set(historyOf(m.id).map(e => e.program).filter(Boolean))] : [];
  if (state.progFilter && !progs.includes(state.progFilter)) state.progFilter = '';
  const h = machineHist(m.id);
  const og = (label, test) => { const l = used.filter(x => test(x.type)); return l.length ? `<optgroup label="${label}">${l.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>` : ''; };
  html += `<div class="field"><select class="picker" id="machPick">${og('Machines',x=>x==='weight')}${og('Exercises',x=>x==='body')}${og('Cardio',isCardioT)}</select></div>

    ${progs.length > 1 ? `<div class="progrow"><span class="label">Program</span><select class="picker" id="progPick"><option value="">All programs</option>${progs.map(p=>`<option ${p===state.progFilter?'selected':''}>${esc(p)}</option>`).join('')}</select></div>` : ''}`;
  if (er) {
    const lv = h.map(e => +e.level||0), totT = h.reduce((a,e)=>a+(+e.duration||0),0), totD = h.reduce((a,e)=>a+entryD(e),0);

  } else if (t) {
    const ds = h.map(entryD), best = Math.max(...ds), totD = ds.reduce((a,b)=>a+b,0);

  } else if (b) {

        rows.map(e => { const d = entryD(e); return `<tr data-act="openwk" data-date="${e.date}"><td>${fmtDate(e.date)}</td><td>${esc(e.program||'–')}</td><td class="${(+e.level||0)===best?'best':''}">${+e.level||0}</td><td>${fmtDur(e.duration)}</td><td>${d?fmtN(d,2):'–'}</td><td>${d&&e.duration?fmtN(d/(e.duration/3600),1):'–'}</td></tr>`; }).join('') + `</tbody></table></div>`;
    } else if (t) {
      const best = Math.max(...h.map(entryD));
      html += `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Program</th><th>Time</th><th>Distance (${D()})</th><th>Pace (/${D()})</th><th>Speed (${D()}/h)</th><th>Incline</th></tr></thead><tbody>` +
        rows.map(e => { const d = entryD(e); return `<tr data-act="openwk" data-date="${e.date}"><td>${fmtDate(e.date)}</td><td>${esc(e.program||'–')}</td><td>${fmtDur(e.duration)}</td><td class="${d===best?'best':''}">${fmtN(d,2)}</td><td>${d?fmtPace(e.duration/d):'–'}</td><td>${e.duration?fmtN(d/(e.duration/3600),1):'–'}</td><td>${fmtN(+e.incline||0,1)}%</td></tr>`; }).join('') + `</tbody></table></div>`;

        rows.map(e => `<tr data-act="openwk" data-date="${e.date}"><td>${fmtDate(e.date)}</td><td>${(e.reps||[]).length}</td><td>${(e.reps||[]).join(' / ')}</td><td class="${totalReps(e)===best?'best':''}">${totalReps(e)}</td><td>${Math.max(0, ...(e.reps||[]).map(Number))}</td></tr>`).join('') + `</tbody></table></div>`;
    } else {
      const best = Math.max(...h.map(entryW));
      html += `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Weight (${W()})</th><th>Sets</th><th>Reps per set</th><th>Total reps</th><th>Volume</th></tr></thead><tbody>` +
        rows.map(e => `<tr data-act="openwk" data-date="${e.date}"><td>${fmtDate(e.date)}</td><td class="${entryW(e)===best?'best':''}">${fmtN(entryW(e))}</td><td>${(e.reps||[]).length}</td><td>${(e.reps||[]).join(' / ')}</td><td>${totalReps(e)}</td><td>${fmtN(volume(e),0)}</td></tr>`).join('') + `</tbody></table></div>`;
    }

                  : b ? [['btotal','Total '+rw,'coral'],['bbest','Best set','amber'],['sets','Sets','sky']]
                      : [['weight','Weight','violet'],['volume','Volume','coral'],['reps','Total reps','sky'],['sets','Sets','amber']];
    if (!state.metric || !metrics.find(x=>x[0]===state.metric)) state.metric = metrics[0][0];
    html += `<div class="chartbox"><div class="metrics">${metrics.map(([k,l,c])=>`<button class="${state.metric===k?'on':''}" style="--mc:var(--${c})" data-act="metric" data-v="${k}">${l}</button>`).join('')}</div><canvas id="chart" data-kind="machine"></canvas></div>
      ${t && state.metric==='pace' ? '<p class="muted" style="font-size:13px">Lower pace is faster.</p>' : '<p class="muted" style="font-size:13px">Tap or drag across the chart to see each session.</p>'}`;
  }
  html += `<h2>Muscles worked</h2>${musCard(musclesOf(m), esc(m.name), `<button class="linkbtn" data-act="editmus" data-id="${m.id}" style="margin-top:8px">Change muscles</button>`, true)}`;
  html += `<div class="btnrow" style="margin-top:16px"><button class="btn ghost" data-act="managem" data-id="${m.id}">Rename or delete machine</button></div>`;
  return html;
}

/* ----- Machines ----- */
function spark(vals, c){
  if (vals.length < 2) return `<svg class="spark" width="70" height="30"></svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const pts = vals.map((v,i)=>[4 + i*(62/(vals.length-1)), 26 - (v-mn)/r*22]);
  const p = pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ');
  const l = pts[pts.length-1];
  return `<svg class="spark" width="70" height="30" viewBox="0 0 70 30"><polyline points="${p}" fill="none" stroke="var(--${c})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${l[0]}" cy="${l[1]}" r="3" fill="var(--${c})"/></svg>`;
}
function libCard(m){
  const h = historyOf(m.id), last = h[h.length-1], T = typeOf(m), t = isCardioT(m.type);
  const meta = last ? `Last: ${shortDate(last.date)} · ${entrySummary(last)}` : 'Not logged yet';
  const trend = h.slice(-10).map(e => m.type === 'ergo' ? (+e.level||0) : t ? entryD(e) : m.type === 'body' ? totalReps(e) : entryW(e));
  return `<button class="mach" data-act="openitem" data-id="${m.id}">
    <span class="mthumb">${bodySvg(musclesOf(m))}</span>
    <span class="body" style="min-width:0"><div style="font-weight:700;font-size:16px">${esc(m.name)}</div><div class="muted" style="font-size:13px"><span class="tag ${T.cls}">${T.word}</span> ${esc(meta)}</div>${h.length ? `<div class="muted" style="font-size:12px">${h.length} session${h.length===1?'':'s'}</div>` : ''}</span>
    ${h.length > 1 ? spark(trend, t?'teal':m.type==='body'?'coral':'violet') : ''}</button>`;
}
function libList(){
  const q = (state.libQ || '').trim().toLowerCase(), f = state.libType || 'all';
  const all = db.machines.filter(m => (f === 'all' || m.type === f || (f === 'cardio' && isCardioT(m.type))) && (!q || m.name.toLowerCase().includes(q) || groupOf(m).toLowerCase().includes(q) || muscleText(musclesOf(m)).toLowerCase().includes(q)));
  if (!all.length) return `<div class="empty"><b>Nothing matches “${esc(state.libQ)}”</b>Add it as a new machine or exercise below.</div>`;
  const used = all.filter(m => historyOf(m.id).length).sort((a,b) => lastEntryOf(b.id).date.localeCompare(lastEntryOf(a.id).date));
  const rest = all.filter(m => !historyOf(m.id).length);
  let html = used.length ? `<div class="label libsec">Recently used</div><div class="list">${used.map(libCard).join('')}</div>` : '';
  [...GROUPS, 'My own'].forEach(g => {
    const l = rest.filter(m => !isCardioT(m.type) && groupOf(m) === g).sort((a,b) => (a.type===b.type?0:a.type==='weight'?-1:1) || a.name.localeCompare(b.name));
    if (l.length) html += `<div class="label libsec">${g}</div><div class="list">${l.map(libCard).join('')}</div>`;
  });
  const tr = rest.filter(m => isCardioT(m.type)).sort((a,b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
  if (tr.length) html += `<div class="label libsec">Cardio</div><div class="list">${tr.map(libCard).join('')}</div>`;
  return html;
}
function viewMachines(){
  const f = state.libType || 'all';
  return `<h2>Machines &amp; exercises</h2>
    <input class="search" id="libQ" type="search" placeholder="Search by name or muscle, e.g. chest" value="${esc(state.libQ||'')}" autocomplete="off">
    <div class="toolbar"><div class="seg">${[['all','All'],['weight','Machines'],['body','Exercises'],['cardio','Cardio']].map(([v,l])=>`<button class="${f===v?'on':''}" data-act="libtype" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div class="actions">

      <button class="btn hot" data-act="newitem" data-type="body">${BODY_ICON}New exercise</button>

}

function niMus(mu){ return (mu.p.length || mu.s.length) ? musCard(mu, 'Muscles (best guess)', '<div class="muted" style="font-size:12.5px;margin-top:6px">You can change these after adding it.</div>') : `<div class="muted" style="font-size:13px">Type a name and the muscles it works will show here. You can pick them yourself after adding it.</div>`; }
function saveNewItem(){
  const n = state.newItem, name = (n.name||'').trim();
  if (!name) return openNewItem(null, 'Type a name first.');

  db.machines.push(m); saveDb(); state.newItem = null; state.libQ = '';

}

function openSheet(html){ const sh = $('#sheet'); sh.innerHTML = '<div class="grab"></div>' + html; sh.scrollTop = 0; sh.classList.add('open'); $('#scrim').classList.add('open'); }

/* --- Entry editor --- */
function startEditor(type, entryId, presetMachine){
  let ed;
  if (entryId) {
    const e = db.entries.find(x => x.id === entryId), m = machine(e.machineId);
    type = m ? m.type : 'weight';
    ed = { id:e.id, type, cardio:isCardioT(type), date:e.date, machineId:e.machineId, newName:'', weight:entryW(e), reps:[...(e.reps||[10,10,10])], min:Math.floor((e.duration||0)/60), sec:Math.round((e.duration||0)%60), distance:entryD(e),
      incline: e.incline ?? '', level: e.level ?? '', program: e.program || 'Manual', newProgram:'', from:null };
  } else {
    const cardio = type === 'cardio' || isCardioT(type);
    if (type === 'cardio') {
      // default to the cardio machine used most recently, else the first treadmill
      const lastC = db.entries.filter(isCardio).sort(byDateThenCreated).pop();
      presetMachine = presetMachine || (lastC && lastC.machineId) || (db.machines.find(m => m.id === 'treadmill') || db.machines.find(m => isCardioT(m.type)) || {}).id;
      type = (machine(presetMachine) || {type:'treadmill'}).type;
    }
    ed = { id:null, type, cardio, date:state.logDate, machineId:'', newName:'', weight:'', reps: type==='body' ? [15,15,15] : [10,10,10], min:'', sec:'', distance:'', incline:'', level:'', program:'Manual', newProgram:'', from:null, hold:false };
    const opts = cardio ? db.machines.filter(m => isCardioT(m.type)) : db.machines.filter(m => m.type === type);
    if (presetMachine) ed.machineId = presetMachine;
    else if (cardio) ed.machineId = opts.length ? (opts.find(m=>m.id==='treadmill')||opts[0]).id : '__new';
    else ed.machineId = opts.length ? '' : '__new';
    if (ed.machineId && ed.machineId !== '__new') autofill(ed);
  }
  state.ed = ed; state.sheet = 'editor'; renderEditor();
}
function autofill(ed){
  const last = lastEntryOf(ed.machineId, ed.id);
  if (!last) { ed.from = null; if (ed.type === 'body') ed.reps = isHold(machine(ed.machineId)) ? [30,30,30] : [15,15,15]; else if (ed.type === 'weight') ed.reps = [10,10,10]; return; }
  if (isCardioT(ed.type)) { ed.min = Math.floor((last.duration||0)/60); ed.sec = Math.round((last.duration||0)%60); ed.distance = entryD(last);
    ed.program = last.program || 'Manual'; ed.incline = last.incline ?? ''; ed.level = last.level ?? ''; }
  else { ed.weight = entryW(last); ed.reps = [...(last.reps||[10])]; }
  ed.from = last.date;
}
function renderEditor(err){

  const opts = db.machines.filter(m => t ? isCardioT(m.type) : m.type === ed.type).sort((a,b)=>a.name.localeCompare(b.name));
  let selDone = false; const opt = m => { const on = !selDone && m.id === ed.machineId; if (on) selDone = true; return `<option value="${m.id}" ${on?'selected':''}>${esc(m.name)}</option>`; };

  else {
    const recent = opts.filter(m => historyOf(m.id).length).sort((a,b) => lastEntryOf(b.id).date.localeCompare(lastEntryOf(a.id).date)).slice(0,8);
    if (recent.length) body += `<optgroup label="Recently used">${recent.map(opt).join('')}</optgroup>`;
    [...GROUPS, 'My own'].forEach(g => { const l = opts.filter(m => groupOf(m) === g); if (l.length) body += `<optgroup label="${g}">${l.map(opt).join('')}</optgroup>`; });

  let fields;

  return t;

      if (f === 'sec') { let tot = (+ed.min||0)*60 + (+ed.sec||0) + s; tot = Math.max(0, tot); ed.min = Math.floor(tot/60); ed.sec = tot%60; $('#edMin').value = ed.min; $('#edSec').value = ed.sec; updateDerived(); break; }

    case 'edkind': { ed.type = el.dataset.v; ed.program = 'Manual'; renderEditor(); break; }
    case 'delprog': { const k = el.dataset.k, p = el.dataset.p; if (db.settings.programs && db.settings.programs[k]) db.settings.programs[k] = db.settings.programs[k].filter(x => x !== p); saveDb(); render(); toast('Removed ' + p); break; }
    case 'edhold': { ed.hold = el.dataset.v === '1'; ed.reps = ed.reps.map(() => ed.hold ? 30 : 15); renderEditor(); break; }
    case 'rename': { const v = $('#renameIn').value.trim(); if (!v) return; machine(state.manageId).name = v; saveDb(); closeSheet(); render(); toast('Renamed to ' + v); break; }
    case 'askdelm': state.confirm = 'delm'; openManage(state.manageId); break;
    case 'delm': { const id = state.manageId; db.entries = db.entries.filter(e => e.machineId !== id); db.machines = db.machines.filter(m => m.id !== id); saveDb(); state.machineId = null; closeSheet(); render(); toast('Machine deleted'); break; }
    case 'unit': db.settings[el.dataset.k] = el.dataset.v; saveDb(); render(); break;
    case 'theme': db.settings.theme = el.dataset.v; saveDb(); render(); break;
    case 'editmus': openMuscles(el.dataset.id); break;
    case 'cyclemus': cycleMuscle(el.dataset.m); break;
    case 'resetmus': { const m = machine(state.musId); const g = defaultMuscles(m); state.mus = {p:g.p, s:g.s}; state.musScroll = $('#sheet').scrollTop; openMuscles(state.musId, true); break; }
    case 'savemus': { const m = machine(state.musId), g = defaultMuscles(m), mu = state.mus;
      const same = JSON.stringify([...mu.p].sort()) === JSON.stringify([...g.p].sort()) && JSON.stringify([...mu.s].sort()) === JSON.stringify([...g.s].sort());
      if (same) delete m.muscles; else m.muscles = {p:[...mu.p], s:[...mu.s]};
      saveDb(); closeSheet(); render(); if (state.tab === 'machines') openItem(m.id); toast('Muscles saved for ' + m.name); break; }
    case 'askc': state.confirm = el.dataset.v; render(); break;
    case 'sample': { const th = db.settings.theme; db = sampleDb(); db.settings.theme = th; } saveDb(); state.confirm = null; state.logDate = today(); render(); toast('Sample workouts loaded'); break;
    case 'erase': { const th = db.settings.theme; db = freshDb(); db.settings.theme = th; } saveDb(); firstRun = false; state.confirm = null; render(); toast('All data erased'); break;
    case 'export': exportData(); break;
    case 'update': { let ok = false; try { ok = window.AndroidBridge.openUpdatePage(); } catch(e){}
      toast(ok ? 'Opening the download page…' : 'No browser found. Visit ' + updateUrl()); break; }
    case 'import': $('#importFile').click(); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target, ed = state.ed;
  if (t.id === 'logDate') { if (t.value) { state.logDate = t.value > today() ? today() : t.value; render(); } return; }
  if (t.id === 'machPick') { state.machineId = t.value; state.metric = null; state.progFilter = ''; render(); return; }
  if (t.id === 'progPick') { state.progFilter = t.value; render(); return; }
  if (t.id === 'libQ') { state.libQ = t.value; $('#liblist').innerHTML = libList(); return; }
  if (t.id === 'niName' && state.newItem) { state.newItem.name = t.value; const b = $('#niMus'); if (b) b.innerHTML = niMus(defaultMuscles({name:t.value, type:state.newItem.type})); return; }
  if (!ed) return;
  if (t.id === 'edWeight') ed.weight = t.value;
  else if (t.id === 'edMin') { ed.min = t.value; updateDerived(); }
  else if (t.id === 'edSec') { ed.sec = t.value; updateDerived(); }
  else if (t.id === 'edDist') { ed.distance = t.value; updateDerived(); }
  else if (t.id === 'edLevel') ed.level = t.value;
  else if (t.id === 'edIncline') ed.incline = t.value;
  else if (t.id === 'edNewProg') ed.newProgram = t.value;
  else if (t.id === 'edNew') { ed.newName = t.value; const box = $('#edMus'); if (box) box.innerHTML = editorMus(ed); }
  else if (t.dataset.rep != null) ed.reps[+t.dataset.rep] = t.value;
});
document.addEventListener('change', ev => {
  const t = ev.target, ed = state.ed;
  if (t.id === 'machPick' || t.id === 'progPick') return;
  if (t.id === 'importFile') { importData(t.files[0]); t.value = ''; return; }
  if (!ed) return;
  if (t.id === 'edMachine') { ed.machineId = t.value; ed.from = null;
    if (t.value !== '__new') { if (ed.cardio) ed.type = machine(t.value).type; autofill(ed); } renderEditor(); }
  else if (t.id === 'edProgram') { ed.program = t.value; renderEditor(); }
  else if (t.id === 'edDate') { if (t.value) ed.date = t.value; }
});
document.addEventListener('focusin', ev => { if (ev.target.matches('.setbox input, .stepper input')) setTimeout(()=>ev.target.select && ev.target.select(), 0); });
window.addEventListener('resize', () => { const cv = $('#chart'); if (cv && cv._chart) paintChart(cv); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { const cv = $('#chart'); if (cv && cv._chart) paintChart(cv); });
// Android hardware back button
window.handleBack = function(){
  if (state.sheet) { closeSheet(); return true; }
  if (state.tab !== 'log') { state.tab = 'log'; render(); return true; }
  return false;
};

/* ============ Backup ============ */
function exportData(){
  const s = JSON.stringify(db, null, 1), name = 'pacos-fitness-backup-' + today() + '.json';
  if (NATIVE) { try { const r = window.AndroidBridge.saveFile(name, s); toast(r || 'Saved to Downloads/' + name); } catch(e){ toast('Could not save the backup file'); } return; }
  toast('In the phone app, this saves ' + name + ' to Downloads');
}
function importData(file){
  if (!file) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.machines || !d.entries) throw 0; d.settings = Object.assign({wUnit:'lb', dUnit:'mi'}, d.settings||{}); db = d; saveDb(); render(); toast(`Restored ${d.entries.length} entries`); } catch(e){ toast('That file is not a Paco’s Fitness Tracker backup'); } };
  r.readAsText(file);
}

/* ============ Sample data ============ */
function sampleDb(){
  const d = freshDb();
  const id = name => d.machines.find(m => m.name === name).id;
  const M = [['Chest Press',90,5],['Lat Pulldown',100,5],['Leg Press',180,10],['Shoulder Press',50,5],['Seated Row',85,5],['Seated Leg Curl',60,5],['Leg Extension',70,5]];
  const B = [['Push-ups',15,1],['Crunches',20,2],['Leg Lifts',12,1],['Plank',40,5]];
  const t0 = today(); const days = [33,31,28,26,24,21,19,17,14,12,10,7,5,3,1];
  days.forEach((back, wi) => {
    const date = addDays(t0, -back), a = wi % 2 === 0, ts = Date.now()-back*86400000;
    (a ? [0,3,1,4] : [2,5,6,1]).forEach((mi, k) => { const [n, base, inc] = M[mi]; const prog = Math.floor(wi / 3) * inc;
      const reps = wi % 3 === 2 ? [12,10,9] : wi % 3 === 1 ? [10,10,9] : [10,10,10];
      d.entries.push({id:uid()+k, created:ts+k, date, machineId:id(n), weight:base+prog, unit:'lb', reps}); });
    (a ? [0,2] : [1,3]).forEach((bi, k) => { const [n, base, inc] = B[bi]; const r = base + Math.floor(wi/2)*inc;
      d.entries.push({id:uid()+'b'+k, created:ts+5+k, date, machineId:id(n), reps:[r, r, Math.max(1, r - (bi===3?10:3))]}); });
    if (wi % 2 === 1 || wi > 11) { const dist = Math.round((1.6 + wi*0.08 + (wi%3)*0.1)*100)/100, pace = 690 - wi*9;
      const prog = ['Manual','Rolling Hills','Intervals','Sprint 8'][wi % 4];
      d.entries.push({id:uid()+'t', created:ts+9, date, machineId:'treadmill', duration:Math.round(dist*pace), distance:dist, dunit:'mi', program:prog, incline: prog === 'Rolling Hills' ? 4 : prog === 'Manual' ? 1 : 1.5}); }
    if (a && wi > 1) d.entries.push({id:uid()+'e', created:ts+8, date, machineId:id('SciFit Upper Body Ergometer'), duration:600 + (wi%3)*120, distance:Math.round((0.9 + wi*0.03)*100)/100, dunit:'mi',
      program:['Manual','QuickStart','Iso-Strength','Power Burst'][(wi/2|0) % 4], level: 4 + Math.floor(wi/3)});
  });
  return d;
}

if (firstRun && !NATIVE) db = sampleDb();
render();
</script>
