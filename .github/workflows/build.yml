# Builds the app on every change. To publish a version, push a tag like v1.6
# (git tag v1.6 && git push origin v1.6): this builds a signed APK and creates the
# GitHub release with it. Publishing a release on the website works too.
#
# One-time setup (Settings > Secrets and variables > Actions > New repository secret):
#   SIGNING_KEYSTORE_BASE64  the release key file, base64-encoded
#   SIGNING_STORE_PASSWORD   the key's password
#   SIGNING_KEY_ALIAS        ironlog
#   SIGNING_KEY_PASSWORD     the key's password (same as above)
name: Build app

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  release:
    types: [ published ]

# A release made on the website can trigger both the tag and the release event;
# run them one after the other so they don't trip over each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the version numbers agree
        env:
          IS_RELEASE: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          V=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "App version: $V"
          if ! grep -q "const APP_VERSION = '$V'" app/src/main/assets/index.html; then
            echo "::error::APP_VERSION in app/src/main/assets/index.html must be '$V' (from gradle.properties)."
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ] && [ "${GITHUB_REF_NAME#v}" != "$V" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match app version $V. Use tag v$V."
            exit 1
          fi

      - name: Build test version
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Build signed release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Pacos-Fitness-Tracker-$GITHUB_REF_NAME.apk"

      - name: Attach the APK to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            NOTES=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
            gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" \
              --title "Paco's Fitness Tracker $GITHUB_REF_NAME" --notes "${NOTES:-See CHANGELOG.md}"
          fi
